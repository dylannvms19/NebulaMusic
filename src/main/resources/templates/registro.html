<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Registro</title>
</head>
<body>
<main class="auth-container">
    <section class="auth-card">
        <form method="POST" action="/crear-cuenta">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" minlength="3">
            <br><br>

            <label for="correo">Correo:</label>
            <input type="email" id="correo" name="correo">
            <br><br>

            <label for="contrasenia">Contraseña:</label>
            <input type="password" id="contrasenia" name="contrasenia">
            <br><br>

            <label for="txt_pseudonimo">Pseudónimo:</label>
            <input type="text" id="txt_pseudonimo" name="txt_pseudonimo" pattern="[a-zA-Z]{3,10}-[0-9]{2,10}">
            <br><br>

            <p>Género:</p>
            <input type="radio" id="genero_m" name="rad_genero" value="masculino">
            <label for="genero_m">Masculino</label>
            <br>
            <input type="radio" id="genero_f" name="rad_genero" value="femenino">
            <label for="genero_f">Femenino</label>
            <br>
            <input type="radio" id="genero_o" name="rad_genero" value="otro">
            <label for="genero_o">Otro</label>
            <br><br>

            <label for="sel_suscripcion">Suscripción:</label>
            <select id="sel_suscripcion" name="sel_suscripcion">
                <option value="gratis">Gratis</option>
                <option value="mensual">Mensual</option>
                <option value="anual">Anual</option>
            </select>
            <br><br>

            <label for="fechaNacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fechaNacimiento" name="fechaNacimiento">
            <br><br>

            <input type="checkbox" id="chk_terminos" name="chk_terminos" value="aceptado">
            <label for="chk_terminos">Acepto los términos y condiciones</label>
            <br><br>

            <label for="comentarios">Comentarios:</label>
            <br>
            <textarea id="comentarios" name="comentarios" rows="4" cols="40" placeholder="Escribe aquí tus comentarios..."></textarea>
            <br><br>

            <input type="submit" value="Registrar">
            <input type="reset" value="Restablecer">
        </form>
    </section>
</main>
<footer>
    <p>Copyright Nébula 2026</p>
</footer>
</body>
</html>
